{% extends "store/base.html" %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="auth-label">
                WELCOME TO LUMIERA
            </span>

            <h1>Create Account</h1>

            <p>
                Begin your journey with LUMIERA JEWELS.
            </p>

        </div>


        {% if error %}

            <div class="auth-error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST" class="auth-form">

            {% csrf_token %}


            <div class="auth-group">

                <label for="username">
                    USERNAME
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    value="{{ request.POST.username }}"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="email">
                    EMAIL ADDRESS
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    value="{{ request.POST.email }}"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="confirm_password">
                    CONFIRM PASSWORD
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                CREATE ACCOUNT
            </button>

        </form>


        <div class="auth-footer">

            <span>
                Already have an account?
            </span>

            <a href="{% url 'login' %}">
                LOGIN
            </a>

        </div>

    </div>

</section>

{% endblock %}
